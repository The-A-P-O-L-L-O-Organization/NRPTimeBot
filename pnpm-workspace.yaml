packages:
  - .
# Supply-chain: don't reject recently-published locked packages (Docker/CI use frozen lockfile + prod install)
minimumReleaseAge: 0
# Don't auto re-install before scripts at runtime (image ships node_modules; avoids recreating it + policy re-checks)
verifyDepsBeforeRun: false
allowBuilds:
  "@biomejs/biome": true
  "@bufbuild/buf": true
  esbuild: true
overrides:
  conventional-changelog-writer: ^9.3.0
  undici: 6.29.1
  # Fix deprecated url.parse() usage in transitive dependencies
  request: 2.88.2
  har-validator: 5.1.5
  uuid: 9.0.1
  core-js: 3.38.1
