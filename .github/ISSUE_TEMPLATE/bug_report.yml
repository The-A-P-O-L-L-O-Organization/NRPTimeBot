name: Bug report
description: Report something that is broken or behaves unexpectedly
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.
        For security vulnerabilities, do **not** use this template — see our [security policy](../../security/policy).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How did the bug occur? Be as specific as possible.
      placeholder: |
        1. Run `/setrate years:'100'`
        2. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      description: How do you run the bot?
      options:
        - Docker (GHCR image)
        - Docker (built locally / docker compose)
        - Node.js directly
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / tag
      description: Image tag (e.g. `1.0.1`, `latest`) or commit SHA
      placeholder: latest / 1.0.1
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant container/bot logs. Redact tokens and secrets!
      render: shell

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, related issues, or anything else that might help.
