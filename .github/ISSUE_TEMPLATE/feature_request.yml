name: Feature request
description: Propose an idea or improvement for the bot
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: Is your feature request related to a problem? What are you trying to achieve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen? If it's a new slash command, describe its usage and who should be allowed to run it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This affects the Discord bot commands/behavior
        - label: This affects the Interlink RPC protocol/layer
        - label: This affects the Docker deployment/tooling

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Any other context, screenshots, or examples of similar features elsewhere.
