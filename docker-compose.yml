services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/the-a-p-o-l-l-o-organization/nrptimebot:latest
    container_name: nrp-time-bot
    env_file:
      - .env
    environment:
      # Interlink server configuration
      - INTERLINK_PORT=3458
      - INTERLINK_API_KEY=${INTERLINK_API_KEY:-}
    volumes:
      - ./data:/app/data
    ports:
      # Expose interlink port for inter-service communication
      - "3458:3458"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3458/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: apollo-interlink
    # Set external to false to let compose create the network
    # Change to true if the network already exists and is managed externally
    external: false