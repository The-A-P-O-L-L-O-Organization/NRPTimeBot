services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/the-a-p-o-l-l-o-organization/nrptimebot:latest
    container_name: nrp-time-bot
    env_file:
      - .env
    environment:
      # Interlink ConnectRPC client configuration
      - INTERLINK_ADDRESS=${INTERLINK_ADDRESS:-}
      - INTERLINK_AUTH_KEY=${INTERLINK_AUTH_KEY:-}
      - INTERLINK_BOT_ID=${INTERLINK_BOT_ID:-nrp-time-bot}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: apollo-interlink
    external: false